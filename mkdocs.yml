# mkdocs.yml
# GitHub Pages documentation site configuration
# Deploy with: gh-pages branch or GitHub Actions

site_name: Agentic Security Demos
site_url: https://jedi-master-council.github.io/agentic-security-demos/
site_description: Educational modules for teaching agentic AI security concepts
site_author: Agentic Security Demos Contributors
copyright: Copyright &copy; 2024–2026 Agentic Security Demos Contributors

repo_url: https://github.com/jedi-master-council/agentic-security-demos
repo_name: jedi-master-council/agentic-security-demos
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link

